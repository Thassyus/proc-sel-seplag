<div
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5"
>
  @for (pessoa of listaPessoas; track $index) {
  <div
    class="w-80 h-40 border bg-gray-50 rounded-lg flex flex-row"
    [ngClass]="{ 'bg-green-300': pessoa.ultimaOcorrencia.dataLocalizacao,
      'bg-red-300': !pessoa.ultimaOcorrencia.dataLocalizacao,
     }"
  >
    @if (pessoa.urlFoto) {
    <div class="w-1/3">
      <img
        [src]="pessoa.urlFoto"
        alt="foto"
        class="object-cover w-full h-full rounded-s-lg"
      />
    </div>
    } @else {
    <div class="w-1/3">
      <img
        [src]="'assets/pessoa-sem-foto.png'"
        alt="foto"
        class="object-scale-down w-full h-full rounded-s-lg p-2"
      />
    </div>
    }

    <div class="flex flex-col p-2">
      <div class="uppercase">
        {{ pessoa.nome }}
      </div>

      <div>
        {{ pessoa.ultimaOcorrencia.dataLocalizacao }}
      </div>

      <div>
        {{ pessoa.ultimaOcorrencia.dtDesaparecimento }}
      </div>
    </div>
  </div>
  }
</div>
