@if (carregandoService.carregando$ | async) {
<div
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50"
>
  <div
    class="flex flex-col justify-center items-center bg-gray-50 p-10 rounded-lg"
  >
    <div>
      <mat-progress-spinner
        mode="indeterminate"
        color="primary"
        diameter="60"
      ></mat-progress-spinner>
    </div>

    <div class="mt-5 mb-5"></div>

    <div>Aguarde, carregando...</div>
  </div>
</div>
}
